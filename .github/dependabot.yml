version: 2

updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    open-pull-requests-limit: 5
    ignore:
      # dtolnay/rust-toolchain@<ver> pins the *Rust toolchain* version (e.g. the
      # MSRV check uses @1.75), not the action release. Dependabot misreads this
      # as an action tag and proposes nonexistent Rust versions, so ignore it.
      - dependency-name: "dtolnay/rust-toolchain"
