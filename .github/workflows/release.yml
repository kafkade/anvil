name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-features

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create release directory
        shell: pwsh
        run: |
          $releaseDir = "winforge-${{ steps.version.outputs.VERSION }}-windows-x64"
          New-Item -ItemType Directory -Path $releaseDir
          Copy-Item target/release/winforge.exe $releaseDir/
          Copy-Item README.md $releaseDir/
          Copy-Item LICENSE $releaseDir/ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md $releaseDir/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse workloads $releaseDir/
          Copy-Item -Recurse docs $releaseDir/

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $releaseDir = "winforge-${{ steps.version.outputs.VERSION }}-windows-x64"
          Compress-Archive -Path $releaseDir -DestinationPath "$releaseDir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winforge-${{ steps.version.outputs.VERSION }}-windows-x64
          path: winforge-${{ steps.version.outputs.VERSION }}-windows-x64.zip
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md

          # Try to get commits since last tag, or use recent commits
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"* %s (%h)" $PREV_TAG..HEAD >> changelog.md
          else
            git log --pretty=format:"* %s (%h)" -20 >> changelog.md
          fi

          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "## Installation" >> changelog.md
          echo "" >> changelog.md
          echo "Download \`winforge-${{ github.ref_name }}-windows-x64.zip\`, extract, and add to your PATH." >> changelog.md
          echo "" >> changelog.md
          echo "Or build from source:" >> changelog.md
          echo "\`\`\`powershell" >> changelog.md
          echo "git clone https://github.com/${{ github.repository }}.git" >> changelog.md
          echo "cd winforge" >> changelog.md
          echo "cargo build --release" >> changelog.md
          echo "\`\`\`" >> changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: |
            artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
