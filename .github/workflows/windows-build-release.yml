name: Windows Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/Winforge.csproj'
  SOLUTION_PATH: 'src'

jobs:
  build-and-test:
    name: Build and Test on Windows
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build
      run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release

    - name: Test
      run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration Release --verbosity normal

  build-windows-matrix:
    name: Build Windows Executables
    needs: build-and-test
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: 
          - win-x64
          - win-x86
          - win-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Get version from tag or commit
      id: version
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
          $VERSION = $matches[1]
        } else {
          $DATE = Get-Date -Format "yyyy.MM.dd"
          $SHA = $env:GITHUB_SHA.Substring(0,8)
          $VERSION = "$DATE-$SHA"
        }
        Write-Output "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        Write-Output "Building version: $VERSION"

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Publish Windows Executable
      run: |
        dotnet publish ${{ env.PROJECT_PATH }} `
          --configuration Release `
          --runtime ${{ matrix.runtime }} `
          --self-contained true `
          --output ./publish/${{ matrix.runtime }} `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -p:TrimMode=link `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0 `
          -p:FileVersion=${{ steps.version.outputs.VERSION }}.0 `
          -p:InformationalVersion=${{ steps.version.outputs.VERSION }}

    - name: Create Windows Package
      shell: pwsh
      run: |
        $RUNTIME = "${{ matrix.runtime }}"
        $VERSION = "${{ steps.version.outputs.VERSION }}"
        $ARCHIVE_NAME = "winforge-$VERSION-$RUNTIME.zip"
        
        # Navigate to publish directory
        Set-Location "./publish/$RUNTIME"
        
        # Verify executable exists and add version info
        if (Test-Path "winforge.exe") {
          Write-Output "✓ Executable found: winforge.exe"
          
          # Get file version info
          $fileInfo = Get-Item "winforge.exe"
          Write-Output "File size: $($fileInfo.Length) bytes"
          
          # Create version info file
          @"
        Winforge v$VERSION
        Platform: $RUNTIME
        Build Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
        File Size: $($fileInfo.Length) bytes
        
        Installation Instructions:
        1. Extract this archive to your desired location
        2. Run winforge.exe from Command Prompt or PowerShell
        3. Use 'winforge --help' to see available commands
        
        System Requirements:
        - Windows 10 version 1607 or later
        - No additional dependencies required (self-contained)
        "@ | Out-File -FilePath "VERSION.txt" -Encoding UTF8
          
          # Include workload examples and documentation
          if (Test-Path "../../workloads") {
            Copy-Item -Path "../../workloads" -Destination "./workloads" -Recurse -Force
            Write-Output "✓ Included workload examples"
          }
          
          if (Test-Path "../../README.md") {
            Copy-Item -Path "../../README.md" -Destination "./README.md"
            Write-Output "✓ Included documentation"
          }
          
          # Create the zip archive
          Compress-Archive -Path "." -DestinationPath "../../$ARCHIVE_NAME" -CompressionLevel Optimal
          Write-Output "✓ Created package: $ARCHIVE_NAME"
        } else {
          Write-Error "❌ Executable not found!"
          exit 1
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: winforge-${{ matrix.runtime }}-${{ steps.version.outputs.VERSION }}
        path: winforge-${{ steps.version.outputs.VERSION }}-${{ matrix.runtime }}.zip
        retention-days: 30

  create-windows-release:
    name: Create GitHub Release
    needs: build-windows-matrix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: version
      shell: pwsh
      run: |
        $VERSION = $env:GITHUB_REF -replace '^refs/tags/v', ''
        Write-Output "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        Write-Output "Release version: $VERSION"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Prepare release assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "./release-assets" -Force
        
        Get-ChildItem -Path "./artifacts" -Recurse -Filter "winforge-*.zip" | ForEach-Object {
          Copy-Item -Path $_.FullName -Destination "./release-assets/"
          Write-Output "Prepared: $($_.Name)"
        }
        
        Write-Output "Release assets:"
        Get-ChildItem -Path "./release-assets" | Format-Table Name, Length

    - name: Generate release notes
      id: release_notes
      shell: pwsh
      run: |
        $VERSION = "${{ steps.version.outputs.VERSION }}"
        
        @"
        # Winforge v$VERSION - Windows Release
        
        Winforge is a Windows workstation setup and management system that automates the installation and configuration of development environments through YAML-based workloads.
        
        ## Windows Downloads
        
        Choose the appropriate package for your Windows system:
        
        - **winforge-$VERSION-win-x64.zip** - Windows 64-bit (Recommended for most PCs)
        - **winforge-$VERSION-win-x86.zip** - Windows 32-bit (Legacy systems)
        - **winforge-$VERSION-win-arm64.zip** - Windows ARM64 (Surface Pro X, etc.)
        
        ## Quick Installation
        
        1. Download the appropriate ZIP file for your Windows system
        2. Extract to any folder (e.g., C:\Tools\Winforge)
        3. Run winforge.exe from Command Prompt, PowerShell, or File Explorer
        
        ## Key Features
        
        - Interactive workload selection with live progress tracking
        - Support for winget, chocolatey, npm, pip, and more package managers
        - YAML-based workload configuration
        - Self-contained executable with no dependencies
        - Windows-optimized builds for x64, x86, and ARM64
        
        ## System Requirements
        
        - Windows 10 version 1607 or later
        - No additional dependencies required (self-contained)
        - Approximately 15MB disk space
        
        ## Getting Started
        
        Run winforge.exe to start the interactive interface, or use:
        - winforge.exe --help for command options
        - winforge.exe --version for version information
        
        ## Issues & Support
        
        Report issues at: https://github.com/${{ github.repository }}/issues
        Documentation: https://github.com/${{ github.repository }}
        "@ | Out-File -FilePath "release_notes.md" -Encoding UTF8
        
        Write-Output "Release notes generated successfully"

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ steps.version.outputs.VERSION }}
        name: Winforge v${{ steps.version.outputs.VERSION }}
        bodyFile: release_notes.md
        draft: false
        prerelease: false
        artifacts: ./release-assets/*
        artifactErrorsFailBuild: true
        generateReleaseNotes: false
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: Windows Security Scan
    runs-on: windows-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Security Analysis
      shell: pwsh
      run: |
        Write-Output "🔍 Running security analysis..."
        
        try {
          dotnet list ${{ env.PROJECT_PATH }} package --vulnerable --include-transitive 2>$null
          Write-Output "✅ Vulnerability scan completed"
        } catch {
          Write-Output "⚠️  Vulnerability scan had issues (non-critical)"
        }

    - name: Dependency Check
      shell: pwsh
      run: |
        Write-Output "📦 Checking for outdated packages..."
        
        try {
          dotnet list ${{ env.PROJECT_PATH }} package --outdated 2>$null
          Write-Output "✅ Dependency check completed"
        } catch {
          Write-Output "⚠️  Dependency check had issues (non-critical)"
        }

    - name: Build Verification
      run: |
        dotnet build ${{ env.PROJECT_PATH }} --configuration Release --verbosity minimal
        Write-Output "✅ Build verification completed"