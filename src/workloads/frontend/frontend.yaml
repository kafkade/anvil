# yaml-language-server: $schema=../workload-schema.json
name: Frontend Development
description: Workload for frontend development
packages:
  winget:
    - Microsoft.VisualStudioCode
    - Git.Git
    - NodeJS.NodeJS
environmentVariables:
  NODE_ENV: development
folders:
  - C:\Dev\Projects
downloads:
  - uri: https://example.com/somefile.zip
    destination: C:\Dev\Projects\somefile.zip