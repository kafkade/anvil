# Rust Developer Workload Example
# A complete Rust development environment

name: rust-developer
version: "1.0.0"
description: "Complete Rust development environment with toolchain, build tools, and IDE support"

packages:
  winget:
    - id: Rustlang.Rustup
    - id: Microsoft.VisualStudio.2022.BuildTools
      override:
        - --override
        - "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
    - id: LLVM.LLVM

files:
  - source: config.toml
    destination: "~/.cargo/config.toml"
    backup: true

commands:
  post_install:
    - run: "rustup default stable"
      description: "Set default Rust toolchain to stable"
      timeout: 120
    - run: "rustup update stable"
      description: "Update stable toolchain"
      timeout: 300
    - run: "rustup component add rust-src rust-analyzer clippy rustfmt llvm-tools"
      description: "Install Rust components"
      timeout: 300
    - run: "cargo install cargo-watch cargo-nextest cargo-audit"
      description: "Install common cargo tools"
      timeout: 900
      continue_on_error: true

environment:
  variables:
    - name: RUST_BACKTRACE
      value: "1"
      scope: user
    - name: CARGO_REGISTRIES_CRATES_IO_PROTOCOL
      value: "sparse"
      scope: user

  path_additions:
    - "~/.cargo/bin"

assertions:
  - name: cargo command exists
    check:
      type: command_exists
      command: cargo
  - name: rustc command exists
    check:
      type: command_exists
      command: rustc
  - name: rustup command exists
    check:
      type: command_exists
      command: rustup
  - name: Cargo directory exists
    check:
      type: dir_exists
      path: "~/.cargo"
  - name: Cargo bin on PATH
    check:
      type: path_contains
      substring: ".cargo/bin"
  - name: RUST_BACKTRACE is set
    check:
      type: env_var
      name: RUST_BACKTRACE
      value: "1"

health:
  package_check: true
  file_check: true
  assertion_check: true
