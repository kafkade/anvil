# Rust Developer Workload Example
# A complete Rust development environment

name: rust-developer
version: "1.0.0"
description: "Complete Rust development environment with toolchain, build tools, and IDE support"

packages:
  winget:
    - id: Rustlang.Rustup
    - id: Microsoft.VisualStudio.2022.BuildTools
      override:
        - --override
        - "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
    - id: LLVM.LLVM

files:
  - source: config.toml
    destination: "~/.cargo/config.toml"
    backup: true

scripts:
  post_install:
    - path: post-install.ps1
      shell: powershell
      description: "Install Rust components, toolchains, and cargo tools"
      timeout: 900

environment:
  variables:
    - name: RUST_BACKTRACE
      value: "1"
      scope: user
    - name: CARGO_REGISTRIES_CRATES_IO_PROTOCOL
      value: "sparse"
      scope: user

  path_additions:
    - "~/.cargo/bin"

assertions:
  - name: cargo command exists
    check:
      type: command_exists
      command: cargo
  - name: rustc command exists
    check:
      type: command_exists
      command: rustc
  - name: rustup command exists
    check:
      type: command_exists
      command: rustup
  - name: Cargo directory exists
    check:
      type: dir_exists
      path: "~/.cargo"
  - name: Cargo bin on PATH
    check:
      type: path_contains
      substring: ".cargo/bin"
  - name: RUST_BACKTRACE is set
    check:
      type: env_var
      name: RUST_BACKTRACE
      value: "1"

health:
  package_check: true
  file_check: true
  assertion_check: true
