# Python Developer Workload Example
# Python development environment with uv package manager

name: python-developer
version: "1.0.0"
description: "Python development environment with uv package manager and common tools"

packages:
  winget:
    - id: astral-sh.uv

files:
  - source: pyproject.toml
    destination: "~/pyproject.toml"
    backup: true

commands:
  post_install:
    - run: "uv python install"
      description: "Install latest Python via uv"
      timeout: 300

environment:
  variables:
    - name: UV_PYTHON_PREFERENCE
      value: "managed"
      scope: user

assertions:
  - name: uv command exists
    check:
      type: command_exists
      command: uv
  - name: Python is available
    check:
      type: any_of
      conditions:
        - type: command_exists
          command: python
        - type: command_exists
          command: python3
  - name: UV_PYTHON_PREFERENCE is set
    check:
      type: env_var
      name: UV_PYTHON_PREFERENCE

health:
  package_check: true
  file_check: true
  assertion_check: true
